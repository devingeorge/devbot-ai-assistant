services:
  - type: web
    name: devbot-ai-assistant
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
  envVars:
    - key: SLACK_BOT_TOKEN
      sync: false
    - key: SLACK_SIGNING_SECRET
      sync: false
    - key: XAI_API_KEY
      sync: false
    - key: REDIS_URL
      sync: false
    - key: SALESFORCE_CLIENT_ID
      sync: false
    - key: SALESFORCE_CLIENT_SECRET
      sync: false
    - key: SLACK_CLIENT_ID
      sync: false
    - key: SLACK_CLIENT_SECRET
      sync: false
    - key: SLACK_STATE_SECRET
      sync: false
    - key: SLACK_BOT_SCOPES
      sync: false
    - key: LEGACY_TEAM_IDS
      sync: false
    - key: LEGACY_MIGRATION_TARGET_IDS
      sync: false
    - key: CLEAR_DATA_ON_UNINSTALL
      sync: false
    - key: PORT
      value: 10000

  - type: redis
    name: devbot-ai-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
